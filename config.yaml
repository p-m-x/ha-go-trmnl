name: "TRMNL (go-trmnl)"
description: >
  Self-hosted backend for TRMNL e-ink display devices, powered by go-trmnl.
  Devices connect to this add-on instead of TRMNL's cloud servers, keeping all
  data local inside Home Assistant.
version: "0.3.0"
slug: "go_trmnl"
init: false
arch:
  - aarch64
  - amd64
  - armhf
startup: services

homeassistant_api: false

ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "TRMNL device API and admin UI"

webui: "http://[HOST]:[PORT:8080]/admin"

map:
  - addon_config:rw

options:
  base_url: ""
  admin_password: ""
  secret_key: ""
  no_encryption: false
  disable_device_auth: false

schema:
  base_url: str
  admin_password: str
  secret_key: str
  no_encryption: bool
  disable_device_auth: bool
